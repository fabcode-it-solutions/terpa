[databases]
; Database connection configuration
; Format: dbname = host=hostname port=port dbname=database user=username password=password
terpa-web-local = host=localhost port=5432 dbname=terpa-web-local user=postgres password=postgres

; Production example (uncomment and modify for production):
; terpa-web-prod = host=prod-postgres-host port=5432 dbname=terpa-web-prod user=terpa_user password=your_secure_password

[pgbouncer]
; Connection pooling configuration
pool_mode = transaction
listen_port = 6432
listen_addr = 127.0.0.1
auth_type = md5
auth_file = userlist.txt

; Connection limits (adjust based on your server capacity)
max_client_conn = 100
default_pool_size = 20
max_db_connections = 20
min_pool_size = 5

; Connection timeouts
server_connect_timeout = 15
server_login_retry = 15
query_timeout = 30
query_wait_timeout = 120
client_idle_timeout = 0
server_idle_timeout = 600
server_lifetime = 3600
server_reset_query = DISCARD ALL
application_name_add_host = 1

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Performance settings
ignore_startup_parameters = extra_float_digits

; Admin interface
admin_users = postgres
stats_users = postgres

; Security (for production, use proper certificate paths)
; server_tls_sslmode = require
; server_tls_ca_file = /path/to/ca-certificate.crt